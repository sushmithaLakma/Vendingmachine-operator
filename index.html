<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VendOps — Fleet Map</title>
<style>
  :root{
    --stone:#E4DED1;
    --paper:#F2EFE8;
    --paper-raised:#FAF8F3;
    --ink:#17181B;
    --ink-soft:#5B5A54;
    --ink-faint:#9B978C;
    --line: rgba(23,24,27,0.13);
    --line-strong: rgba(23,24,27,0.24);
    --cobalt:#1D3AE8;
    --cobalt-soft: rgba(29,58,232,0.12);
    --cobalt-glass: rgba(64,92,240,0.16);
    --ember:#E1551F;
    --ember-soft: rgba(225,85,31,0.14);
    --ember-glass: rgba(225,85,31,0.18);
    --glass-fill: rgba(255,255,255,0.50);
    --glass-fill-strong: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.7);
    --glass-shadow: 0 24px 46px -20px rgba(23,20,10,0.30), 0 1px 0 rgba(255,255,255,0.55) inset;
    --scrim: rgba(20,18,14,0.38);
    --display: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"]{
    --stone:#141310;
    --paper:#1C1A17;
    --paper-raised:#242220;
    --ink:#F1EEE6;
    --ink-soft:#B8B3A7;
    --ink-faint:#726E64;
    --line: rgba(241,238,230,0.12);
    --line-strong: rgba(241,238,230,0.22);
    --cobalt:#5C79FF;
    --cobalt-soft: rgba(92,121,255,0.18);
    --cobalt-glass: rgba(92,121,255,0.20);
    --ember:#FF7A42;
    --ember-soft: rgba(255,122,66,0.18);
    --ember-glass: rgba(255,122,66,0.22);
    --glass-fill: rgba(36,34,30,0.48);
    --glass-fill-strong: rgba(40,38,34,0.78);
    --glass-border: rgba(255,255,255,0.10);
    --glass-shadow: 0 24px 46px -20px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05) inset;
    --scrim: rgba(0,0,0,0.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stone:#141310; --paper:#1C1A17; --paper-raised:#242220;
      --ink:#F1EEE6; --ink-soft:#B8B3A7; --ink-faint:#726E64;
      --line: rgba(241,238,230,0.12); --line-strong: rgba(241,238,230,0.22);
      --cobalt:#5C79FF; --cobalt-soft: rgba(92,121,255,0.18); --cobalt-glass: rgba(92,121,255,0.20);
      --ember:#FF7A42; --ember-soft: rgba(255,122,66,0.18); --ember-glass: rgba(255,122,66,0.22);
      --glass-fill: rgba(36,34,30,0.48); --glass-fill-strong: rgba(40,38,34,0.78);
      --glass-border: rgba(255,255,255,0.10);
      --glass-shadow: 0 24px 46px -20px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05) inset;
      --scrim: rgba(0,0,0,0.55);
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:30px 16px;
  }
  button, input{ font-family:inherit; }
  ::selection{ background:var(--cobalt-soft); }

  .device{
    width:100%; max-width:428px; height:920px; max-height:92vh;
    background:var(--paper);
    border-radius:34px; overflow:hidden; position:relative;
    box-shadow:0 40px 80px -30px rgba(20,17,10,0.4), 0 0 0 1px var(--line-strong);
  }
  @media (max-width:520px){
    body{ padding:0; }
    .device{ max-width:100%; height:100vh; max-height:100vh; border-radius:0; box-shadow:none; }
  }

  /* ---------- Map stage ---------- */
  .map-viewport{
    position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab;
  }
  .map-viewport.dragging{ cursor:grabbing; }
  .map-layer{
    position:absolute; left:0; top:0; width:900px; height:1300px;
    background:var(--paper);
    will-change:transform;
  }
  .map-layer svg.streets{ position:absolute; inset:0; width:100%; height:100%; }
  .map-blob{
    position:absolute; border-radius:50%; filter:blur(50px); pointer-events:none;
  }
  .watermark{
    position:absolute; left:44px; top:120px; font-weight:700; letter-spacing:-0.03em;
    font-size:96px; line-height:0.86; color:var(--ink); opacity:0.05; white-space:pre; pointer-events:none;
    text-transform:uppercase;
  }

  .pin{
    position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px;
    border-radius:50%; border:none; padding:0; cursor:pointer;
    background:var(--glass-fill-strong);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);
    box-shadow:0 8px 18px -8px rgba(20,17,10,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .pin::after{
    content:""; width:9px; height:9px; border-radius:50%; background:var(--pin-color, var(--cobalt));
  }
  .pin.attention{ animation:pinpulse 2.6s ease-in-out infinite; }
  @keyframes pinpulse{
    0%,100%{ box-shadow:0 8px 18px -8px rgba(20,17,10,0.35), 0 0 0 0 var(--ember-glass); }
    50%{ box-shadow:0 8px 18px -8px rgba(20,17,10,0.35), 0 0 0 8px transparent; }
  }
  @media (prefers-reduced-motion:reduce){ .pin.attention{ animation:none; } }

  .walker{
    position:absolute; width:5px; height:5px; border-radius:50%; background:var(--ink);
    opacity:0.28; pointer-events:none;
  }

  /* ---------- Chrome overlay (fixed above map) ---------- */
  .chrome{ position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; }
  .chrome > *{ pointer-events:auto; }

  .topfade{
    position:absolute; left:0; right:0; top:0; height:150px;
    background:linear-gradient(180deg, var(--paper) 0%, color-mix(in srgb, var(--paper) 70%, transparent) 60%, transparent 100%);
    pointer-events:none !important;
  }

  .topbar{ position:relative; padding:16px 18px 0; z-index:2; }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; }
  .mark{ display:flex; align-items:center; gap:7px; }
  .mark-glyph{ width:22px; height:22px; }
  .mark-word{ font-size:13px; font-weight:700; letter-spacing:-0.01em; }
  .navrow{ display:flex; gap:16px; }
  .navlink{
    background:none; border:none; padding:2px 0; cursor:pointer; color:var(--ink-faint);
    font-size:10px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
    border-bottom:1.5px solid transparent;
  }
  .navlink.active{ color:var(--ink); border-color:var(--cobalt); }
  .navlink:focus-visible{ outline:2px solid var(--cobalt); outline-offset:3px; }
  .counter{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:0.02em;
    color:var(--cobalt); font-variant-numeric:tabular-nums;
  }
  .counter.attn{ color:var(--ember); }

  .metarow{
    display:flex; align-items:baseline; justify-content:space-between; margin-top:14px;
    padding:0 2px;
  }
  .collection-label{ font-size:11px; letter-spacing:.03em; color:var(--ink-soft); }
  .collection-label b{ color:var(--ink); font-weight:700; }
  .liveclock{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); }

  .locrow{ margin-top:8px; display:flex; align-items:center; gap:6px; }
  .locpin-icon{ width:12px; height:12px; color:var(--ember); flex:none; }
  #locInput{
    border:none; background:none; font-size:11.5px; font-weight:700; color:var(--ink);
    padding:2px 0; border-bottom:1px dashed transparent; width:auto; max-width:220px;
  }
  #locInput:focus{ outline:none; border-color:var(--line-strong); }
  .loc-edit-hint{ font-size:9.5px; color:var(--ink-faint); text-decoration:underline; background:none; border:none; cursor:pointer; padding:0; }

  /* ---------- Floating dock (jump to queue + geolocate) ---------- */
  .dock{
    position:absolute; right:16px; bottom:104px; z-index:3; display:flex; flex-direction:column; gap:10px;
  }
  .dock-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-border);
    background:var(--glass-fill-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:var(--glass-shadow); display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--ink);
  }
  .dock-btn:active{ transform:scale(0.94); }
  .dock-btn.primary{ background:var(--cobalt); color:#fff; border-color:transparent; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    background:linear-gradient(0deg, var(--paper) 30%, color-mix(in srgb, var(--paper) 60%, transparent) 80%, transparent 100%);
    padding:26px 18px calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:26px;
  }
  .tab{
    background:none; border:none; cursor:pointer; color:var(--ink-faint);
    font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    padding:4px 2px; border-bottom:1.5px solid transparent;
  }
  .tab.active{ color:var(--ink); border-color:var(--cobalt); }

  /* ---------- Bottom sheet ---------- */
  .scrim{
    position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:10;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:11;
    background:var(--glass-fill-strong); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-top:1px solid var(--glass-border); border-radius:26px 26px 0 0; box-shadow:var(--glass-shadow);
    padding:10px 20px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--line-strong); margin:6px auto 14px; }
  .sheet-top{ display:flex; gap:14px; align-items:flex-start; }
  .sheet-icon{
    width:56px; height:56px; border-radius:16px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--icon-bg, var(--cobalt-glass));
  }
  .sheet-icon svg{ width:30px; height:30px; }
  .sheet-id{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
  .sheet-name{ font-size:18px; font-weight:700; letter-spacing:-.01em; margin-top:1px; }
  .sheet-status{
    display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:10.5px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--status-color, var(--cobalt));
  }
  .sheet-status .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .sheet-issue{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:12px; }
  .sheet-meta{ display:flex; gap:18px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .sheet-meta div{ font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }
  .sheet-meta b{ display:block; font-family:var(--mono); font-size:13px; color:var(--ink); font-weight:700; margin-top:3px; letter-spacing:0; text-transform:none; }
  .sheet-actions{ display:flex; gap:8px; margin-top:16px; }
  .sheet-btn{
    flex:1; border-radius:13px; border:1px solid var(--line-strong); background:var(--paper-raised);
    color:var(--ink); font-size:12.5px; font-weight:700; padding:12px 6px; cursor:pointer; text-align:center;
  }
  .sheet-btn.primary{ background:var(--cobalt); color:#fff; border-color:transparent; }
  .sheet-btn.ember{ background:var(--ember); color:#fff; border-color:transparent; }
  .sheet-btn:active{ transform:scale(.97); }
  .sheet-btn.sent{ opacity:.55; }
  .sheet-close{
    position:absolute; right:14px; top:12px; width:28px; height:28px; border-radius:50%; border:none;
    background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    z-index:80; white-space:nowrap;
  }
  :root[data-theme="dark"] .toast{ background:var(--paper-raised); color:var(--ink); border:1px solid var(--line-strong); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion:reduce){ .toast, .sheet, .pin{ transition:none; animation:none; } }
</style>
</head>
<body>

<div class="device">
  <div class="map-viewport" id="mapViewport">
    <div class="map-layer" id="mapLayer">
      <div class="map-blob" style="width:420px;height:420px;left:520px;top:120px;background:var(--cobalt-glass);"></div>
      <div class="map-blob" style="width:380px;height:380px;left:60px;top:640px;background:var(--ember-glass);"></div>
      <svg class="streets" viewBox="0 0 900 1300" fill="none">
        <path d="M0 380 H900" stroke="var(--line)" stroke-width="2"/>
        <path d="M0 720 H900" stroke="var(--line)" stroke-width="2"/>
        <path d="M0 1020 H900" stroke="var(--line)" stroke-width="2"/>
        <path d="M260 0 V1300" stroke="var(--line)" stroke-width="2"/>
        <path d="M560 0 V1300" stroke="var(--line)" stroke-width="2"/>
        <path d="M0 60 L900 980" stroke="var(--line)" stroke-width="2"/>
        <rect x="150" y="640" width="220" height="180" rx="18" fill="var(--stone)" opacity="0.6"/>
        <path d="M40 1100 Q 400 950 860 1180" stroke="var(--cobalt-soft)" stroke-width="14" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="watermark" id="watermark">DOWNTOWN{'\n'}LOOP</div>

      <div class="walker" id="w1"></div>
      <div class="walker" id="w2"></div>
      <div class="walker" id="w3"></div>
      <div class="walker" id="w4"></div>
      <div class="walker" id="w5"></div>

      <div id="pinLayer"></div>
    </div>
  </div>

  <div class="chrome">
    <div class="topfade"></div>
    <header class="topbar">
      <div class="topbar-row">
        <div class="mark">
          <svg class="mark-glyph" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 18H15M6 18V9" stroke="var(--cobalt)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mark-word">VENDOPS</span>
        </div>
        <nav class="navrow">
          <button class="navlink active">Map</button>
          <button class="navlink" onclick="showToast('Alerts — coming to this screen next')">Alerts</button>
          <button class="navlink" onclick="showToast('Analytics — parked for now')">Analytics</button>
          <button class="navlink" onclick="showToast('Profile — routes, team, settings')">Profile</button>
        </nav>
      </div>
      <div class="metarow">
        <div class="collection-label">A/12 — <b>Fleet Map</b> · 8 machines</div>
        <div class="counter attn" id="counterBadge">(2/8)</div>
      </div>
      <div class="locrow">
        <svg class="locpin-icon" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13A7 7 0 105 9c0 5.42 7 13 7 13z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.4" fill="currentColor"/></svg>
        <input id="locInput" value="Austin — Downtown Loop" />
        <button class="loc-edit-hint" onclick="document.getElementById('locInput').focus()">edit</button>
      </div>
    </header>
  </div>

  <div class="dock">
    <button class="dock-btn" aria-label="Use my location" onclick="useMyLocation()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="5.2" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="dock-btn primary" aria-label="Jump to nearest issue" onclick="focusAttention()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3v13M12 16l-5-5M12 16l5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <nav class="bottomnav" aria-label="Primary">
    <button class="tab active">Map</button>
    <button class="tab" onclick="showToast('Alerts — coming to this screen next')">Alerts</button>
    <button class="tab" onclick="showToast('Analytics — parked for now')">Analytics</button>
    <button class="tab" onclick="showToast('Profile — routes, team, settings')">Profile</button>
  </nav>

  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <button class="sheet-close" onclick="closeSheet()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-handle"></div>
    <div class="sheet-top">
      <div class="sheet-icon" id="sheetIcon">
        <svg viewBox="0 0 24 24" fill="none" id="sheetIconSvg"><rect x="5" y="2.5" width="14" height="19" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="7.3" y="5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="12.7" y="5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="7.3" y="10" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="12.7" y="10" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><circle cx="15.5" cy="17.3" r="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
      </div>
      <div>
        <div class="sheet-id" id="sheetId">#00</div>
        <div class="sheet-name" id="sheetName">Machine</div>
        <div class="sheet-status" id="sheetStatus"><span class="dot"></span><span id="sheetStatusText">Stocked</span></div>
      </div>
    </div>
    <div class="sheet-issue" id="sheetIssue"></div>
    <div class="sheet-meta">
      <div>Last visit<b id="sheetVisit">—</b></div>
      <div>Category<b id="sheetCategory">—</b></div>
    </div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const machines = [
    { id:'#01', name:'Downtown Transit Hub', x:420, y:560, status:'ok', category:'Snacks · Coffee', issue:'Fully stocked, running smoothly.', visit:'Today, 8:10a' },
    { id:'#07', name:'Tech Corridor — Bldg C', x:620, y:410, status:'critical', category:'Snacks · Cold Drinks', issue:'Two columns empty since this morning. Card reader also flagged flaky — worth a look while restocking.', visit:'Yesterday' },
    { id:'#05', name:'University Row', x:290, y:290, status:'warning', category:'Candy', issue:'Candy at 22% and selling fast — a campus event nearby is driving demand.', visit:'2 days ago' },
    { id:'#04', name:'Riverside Park', x:190, y:700, status:'ok', category:'Healthy · Snacks', issue:'Stocked, slightly overweighted on Healthy this week.', visit:'Yesterday' },
    { id:'#09', name:'City Hospital Lobby', x:520, y:790, status:'repair', category:'Snacks · Coffee', issue:'Coin mechanism jammed. Card payments still work; coin sales are blocked until serviced.', visit:'3 days ago' },
    { id:'#02', name:'Central Library', x:380, y:460, status:'ok', category:'Snacks · Coffee', issue:'Fully stocked.', visit:'Today, 7:40a' },
    { id:'#12', name:'Airport Terminal B', x:710, y:990, status:'critical', category:'Snacks', issue:'Snacks empty for ~40 minutes on a high-traffic route — highest sales-loss risk right now.', visit:'Yesterday' },
    { id:'#08', name:'Westside Gym', x:150, y:960, status:'ok', category:'Healthy · Cold Drinks', issue:'Fully stocked.', visit:'2 days ago' },
  ];
  const statusMeta = {
    ok:       { color:'var(--cobalt)', label:'Stocked', iconBg:'var(--cobalt-glass)' },
    warning:  { color:'var(--ember)',  label:'Low stock', iconBg:'var(--ember-glass)' },
    critical: { color:'var(--ember)',  label:'Empty', iconBg:'var(--ember-glass)' },
    repair:   { color:'var(--ember)',  label:'Needs repair', iconBg:'var(--ember-glass)' },
  };

  const pinLayer = document.getElementById('pinLayer');
  machines.forEach(m=>{
    const meta = statusMeta[m.status];
    const btn = document.createElement('button');
    btn.className = 'pin' + (m.status!=='ok' ? ' attention' : '');
    btn.style.left = m.x+'px'; btn.style.top = m.y+'px';
    btn.style.setProperty('--pin-color', meta.color);
    btn.setAttribute('aria-label', m.name+' — '+meta.label);
    btn.addEventListener('click', ()=> openSheet(m));
    pinLayer.appendChild(btn);
  });

  const attnCount = machines.filter(m=>m.status!=='ok').length;
  const badge = document.getElementById('counterBadge');
  badge.textContent = '('+attnCount+'/'+machines.length+')';
  if(attnCount===0){ badge.classList.remove('attn'); }

  /* ---------------- sheet ---------------- */
  const scrim = document.getElementById('scrim');
  const sheet = document.getElementById('sheet');
  window.openSheet = function(m){
    const meta = statusMeta[m.status];
    document.getElementById('sheetId').textContent = m.id;
    document.getElementById('sheetName').textContent = m.name;
    document.getElementById('sheetStatusText').textContent = meta.label;
    document.getElementById('sheetStatus').style.setProperty('--status-color', meta.color);
    document.getElementById('sheetIssue').textContent = m.issue;
    document.getElementById('sheetVisit').textContent = m.visit;
    document.getElementById('sheetCategory').textContent = m.category;
    document.getElementById('sheetIcon').style.setProperty('--icon-bg', meta.iconBg);
    document.getElementById('sheetIconSvg').style.color = meta.color;

    const actions = document.getElementById('sheetActions');
    actions.innerHTML = '';
    if(m.status==='repair'){
      actions.appendChild(makeBtn('Dispatch tech','ember','Technician notified for '+m.id));
    } else if(m.status!=='ok'){
      actions.appendChild(makeBtn('Restock now','primary','Restock dispatched for '+m.id));
    }
    actions.appendChild(makeBtn('Notify delivery','', 'Nearest courier notified about '+m.id));

    scrim.classList.add('show');
    sheet.classList.add('show');
  };
  function makeBtn(label, cls, msg){
    const b = document.createElement('button');
    b.className = 'sheet-btn' + (cls?' '+cls:'');
    b.textContent = label;
    b.addEventListener('click', ()=>{ b.textContent='Sent ✓'; b.classList.add('sent'); b.disabled=true; showToast(msg); });
    return b;
  }
  window.closeSheet = function(){ scrim.classList.remove('show'); sheet.classList.remove('show'); };

  /* ---------------- toast ---------------- */
  let toastTimer;
  window.showToast = function(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
  };

  /* ---------------- location input ---------------- */
  const locInput = document.getElementById('locInput');
  const watermark = document.getElementById('watermark');
  function syncWatermark(){
    const parts = locInput.value.split('—');
    const last = (parts[parts.length-1] || locInput.value).trim();
    watermark.textContent = last.toUpperCase();
  }
  locInput.addEventListener('change', syncWatermark);
  locInput.addEventListener('blur', syncWatermark);

  window.useMyLocation = function(){
    if(!navigator.geolocation){ showToast('Location services unavailable on this device'); return; }
    showToast('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ showToast('Located · '+pos.coords.latitude.toFixed(2)+', '+pos.coords.longitude.toFixed(2)); },
      ()=>{ showToast('Location permission denied'); },
      { timeout:6000 }
    );
  };

  window.focusAttention = function(){
    const first = machines.find(m=>m.status!=='ok');
    if(first) panTo(first.x, first.y);
  };

  /* ---------------- draggable map ---------------- */
  const viewport = document.getElementById('mapViewport');
  const layer = document.getElementById('mapLayer');
  let tx = -260, ty = -260, dragging=false, startX=0, startY=0, baseX=0, baseY=0;

  function clamp(){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const minX = Math.min(0, vw - 900), minY = Math.min(0, vh - 1300);
    tx = Math.max(minX, Math.min(0, tx));
    ty = Math.max(minY, Math.min(0, ty));
  }
  function apply(){ layer.style.transform = 'translate3d('+tx+'px,'+ty+'px,0)'; }
  function panTo(x,y){
    tx = -(x - viewport.clientWidth/2);
    ty = -(y - viewport.clientHeight/2);
    clamp();
    layer.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';
    apply();
    setTimeout(()=>{ layer.style.transition=''; }, 520);
  }
  clamp(); apply();

  viewport.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.pin')) return; // let the pin's own click fire instead of starting a drag
    dragging=true; viewport.classList.add('dragging'); viewport.setPointerCapture(e.pointerId);
    startX=e.clientX; startY=e.clientY; baseX=tx; baseY=ty;
  });
  viewport.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    tx = baseX + (e.clientX-startX); ty = baseY + (e.clientY-startY);
    clamp(); apply();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
    viewport.addEventListener(ev, ()=>{ dragging=false; viewport.classList.remove('dragging'); });
  });
  window.addEventListener('resize', ()=>{ clamp(); apply(); });

  /* ---------------- walking dots, for fun ---------------- */
  const walkPaths = [
    { el:'w1', x1:20, y1:390, x2:880, y2:390, dur:26 },
    { el:'w2', x1:880, y1:730, x2:20, y2:730, dur:32 },
    { el:'w3', x1:270, y1:20, x2:270, y2:1280, dur:38 },
    { el:'w4', x1:20, y1:60, x2:860, y2:940, dur:44 },
    { el:'w5', x1:570, y1:1290, x2:570, y2:30, dur:30 },
  ];
  walkPaths.forEach(p=>{
    const el = document.getElementById(p.el);
    let start = performance.now() - Math.random()*p.dur*1000;
    function frame(now){
      const t = ((now-start)/1000 % (p.dur*2)) / p.dur;
      const f = t<=1 ? t : 2-t; // ping-pong 0..1..0
      const x = p.x1 + (p.x2-p.x1)*f;
      const y = p.y1 + (p.y2-p.y1)*f;
      el.style.transform = 'translate('+x+'px,'+y+'px)';
      requestAnimationFrame(frame);
    }
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      requestAnimationFrame(frame);
    } else {
      el.style.display='none';
    }
  });

  syncWatermark();
})();
</script>
</body>
</html>
