<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VendOps</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:#FFFFFF;
    color:#17181B;
    font-family:-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:30px 16px;
  }

  .device{
    width:100%; max-width:428px; height:920px; max-height:92vh;
    background:#FFFFFF;
    border-radius:34px; overflow:hidden; position:relative;
    box-shadow:0 40px 80px -30px rgba(20,17,10,0.28), 0 0 0 1px rgba(23,24,27,0.24);
  }
  @media (max-width:520px){
    body{ padding:0; }
    .device{ max-width:100%; height:100vh; max-height:100vh; border-radius:0; box-shadow:none; }
  }
</style>
</head>
<body>

<div class="device"></div>

</body>
</html>
