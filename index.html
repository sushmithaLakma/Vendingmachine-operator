<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VendOps — Fleet Map</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-raised:#F6F6F7;
    --ink:#17181B;
    --ink-soft:#5B5A54;
    --ink-faint:#9B978C;
    --line: rgba(23,24,27,0.13);
    --line-strong: rgba(23,24,27,0.24);
    --cobalt:#1D3AE8;
    --cobalt-soft: rgba(29,58,232,0.10);
    --yellow:#F4C430;
    --orange:#E8791E;
    --orange-soft: rgba(232,121,30,0.10);
    --scrim: rgba(20,30,55,0.32);
    --sans: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --wide: "Arial", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:#FFFFFF;
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:30px 16px;
  }
  button, input{ font-family:inherit; }
  ::selection{ background:var(--cobalt-soft); }

  .wide-heading{ font-family:var(--wide); font-weight:800; font-stretch:expanded; letter-spacing:-.01em; }

  .device{
    width:100%; max-width:428px; height:920px; max-height:92vh;
    background:var(--paper);
    border-radius:34px; overflow:hidden; position:relative;
    box-shadow:0 40px 80px -30px rgba(20,17,10,0.28), 0 0 0 1px var(--line-strong);
  }
  @media (max-width:520px){
    body{ padding:0; }
    .device{ max-width:100%; height:100vh; max-height:100vh; border-radius:0; box-shadow:none; }
  }

  /* ---------- Screens carousel (Map / List) ---------- */
  .screens-viewport{ position:absolute; inset:0; overflow:hidden; touch-action:pan-y; }
  .screens-track{
    display:flex; width:200%; height:100%;
    transition: transform .32s cubic-bezier(.22,.8,.3,1);
  }
  .screens-track.dragging{ transition:none; }
  .screen-panel{ width:50%; height:100%; position:relative; overflow:hidden; flex:none; }
  @media (prefers-reduced-motion:reduce){ .screens-track{ transition:none; } }

  /* ---------- Map stage ---------- */
  .map-viewport{
    position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; background:#fff;
  }
  .map-viewport.dragging{ cursor:grabbing; }
  .map-layer{
    position:absolute; left:0; top:0; width:900px; height:1300px;
    background:#FFFFFF; transform-origin:0 0;
    will-change:transform;
  }
  .map-layer-content{
    position:absolute; inset:0;
    -webkit-mask-image: radial-gradient(ellipse 72% 66% at 50% 46%, #000 82%, transparent 100%);
    mask-image: radial-gradient(ellipse 72% 66% at 50% 46%, #000 82%, transparent 100%);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }
  .map-layer svg.streets{ position:absolute; inset:0; width:100%; height:100%; }

  .pin{
    position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px;
    border:2.5px solid #fff; border-radius:50%; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--wide); font-weight:800; font-size:10.5px; color:#fff;
    box-shadow:0 6px 12px -4px rgba(23,24,27,0.35);
  }
  .pin.attention{ animation:pinpulse 2.2s ease-in-out infinite; }
  @keyframes pinpulse{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-3px) scale(1.06); }
  }
  @media (prefers-reduced-motion:reduce){ .pin.attention{ animation:none; } }

  .walker{
    position:absolute; width:5px; height:5px; border-radius:50%; background:var(--cobalt);
    opacity:0.28; pointer-events:none;
  }

  /* ---------- Chrome overlay (fixed above map) ---------- */
  .chrome{ position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; }
  .chrome > *{ pointer-events:auto; }

  .topfade{
    position:absolute; left:0; right:0; top:0; height:130px;
    background:linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.75) 55%, transparent 100%);
    pointer-events:none !important;
  }

  .topbar{ position:relative; padding:18px 18px 0; z-index:2; }
  .greeting{ font-size:21px; line-height:1.1; }
  .locrow{ margin-top:5px; display:flex; align-items:center; gap:6px; cursor:text; }
  .locpin-icon{ width:12px; height:12px; color:var(--cobalt); flex:none; }
  #locInput{
    border:none; background:none; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    padding:2px 0; width:auto; max-width:240px;
  }
  #locInput:focus{ outline:none; }

  /* ---------- Floating dock ---------- */
  .dock{
    position:absolute; right:16px; bottom:172px; z-index:3; display:flex; flex-direction:column; gap:10px;
  }
  .dock-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line-strong);
    background:#fff; box-shadow:0 14px 28px -16px rgba(23,20,10,0.3);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--cobalt);
  }
  .dock-btn:active{ transform:scale(0.94); }
  .dock-btn.primary{ background:var(--cobalt); color:#fff; border-color:transparent; }

  /* ---------- Fixed legend strip (map screen only, does not pan) ---------- */
  .legendwrap{
    position:absolute; left:0; right:0; bottom:0; z-index:4;
    padding:10px 0 90px;
    background:linear-gradient(0deg, #fff 55%, rgba(255,255,255,0.85) 80%, transparent 100%);
  }
  .legend-title{ padding:0 18px 6px; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .legend-scroll{ display:flex; gap:8px; overflow-x:auto; padding:0 18px; }
  .legend-card{
    flex:none; min-width:130px; background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:9px 11px; box-shadow:0 10px 22px -14px rgba(23,20,10,0.25);
  }
  .legend-cat{ font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px; }
  .legend-item{ display:flex; align-items:center; gap:7px; padding:2px 0; }
  .legend-badge{
    flex:none; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--wide); font-weight:800; font-size:8px; color:#fff;
  }
  .legend-name{ font-size:11px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:96px; }

  /* ---------- Bottom nav ---------- */
  .navwrap{
    position:absolute; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center;
    padding:0 18px calc(16px + env(safe-area-inset-bottom));
  }
  .navbar{
    display:flex; gap:4px; background:#fff; border:1px solid var(--line-strong);
    border-radius:20px; padding:5px; box-shadow:0 18px 34px -18px rgba(23,20,10,0.3);
  }
  .tab{
    background:none; border:none; cursor:pointer; color:var(--ink-faint);
    font-size:12.5px; font-weight:700; padding:9px 26px; border-radius:15px;
  }
  .tab.active{ color:#fff; background:var(--cobalt); }

  /* ---------- List screen ---------- */
  .page{ position:absolute; inset:0; overflow-y:auto; padding-bottom:110px; -webkit-overflow-scrolling:touch; }
  .page-head{ padding:18px 18px 4px; }
  .page-title{ font-size:22px; }
  .searchrow{
    margin:14px 18px 12px; display:flex; align-items:center; gap:8px;
    background:var(--paper-raised); border-radius:13px; padding:10px 12px;
  }
  .searchrow svg{ width:15px; height:15px; color:var(--ink-faint); flex:none; }
  .searchrow input{ border:none; background:none; font-size:13.5px; color:var(--ink); flex:1; min-width:0; }
  .searchrow input:focus{ outline:none; }

  .list-row{
    display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .list-when{ flex:none; width:56px; }
  .list-when .d1{ font-size:11px; font-weight:700; color:var(--ink); }
  .list-when .d2{ font-size:9.5px; color:var(--ink-faint); font-family:var(--mono); }
  .list-mid{ flex:1; min-width:0; }
  .list-name{ font-size:14px; font-weight:700; }
  .list-address{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .list-status{ flex:none; font-size:11px; font-weight:700; text-align:right; }
  .list-status.ok{ color:var(--cobalt); }
  .list-status.alert{ color:var(--orange); }
  .empty-state{ padding:40px 18px; text-align:center; color:var(--ink-faint); font-size:13px; }

  /* ---------- Quick card (no border, photo stack trigger) ---------- */
  .scrim{
    position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:41;
    background:#FFFFFF; border-radius:22px;
    box-shadow:0 28px 60px -20px rgba(23,20,10,0.35);
    padding:18px 18px;
    transform:translateY(16px) scale(0.98); opacity:0; transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
    pointer-events:none;
  }
  .sheet.show{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
  .sheet-top{ display:flex; align-items:center; gap:10px; }
  .sheet-badge{
    flex:none; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--wide); font-weight:800; font-size:11px; color:#fff;
  }
  .sheet-name{ font-size:16.5px; font-weight:700; letter-spacing:-.01em; }
  .sheet-address{ font-size:12px; color:var(--ink-soft); margin-top:1px; line-height:1.3; }
  .sheet-phrase{ font-size:13px; font-weight:700; margin-top:12px; }
  .sheet-phrase.ok{ color:var(--cobalt); }
  .sheet-phrase.alert{ color:var(--orange); }

  .photo-stack-row{ display:flex; align-items:center; gap:12px; margin-top:16px; cursor:pointer; background:none; border:none; padding:0; width:100%; text-align:left; }
  .photo-stack{ position:relative; width:58px; height:46px; flex:none; }
  .photo-stack .tile{
    position:absolute; width:44px; height:38px; border-radius:9px; background:var(--paper-raised);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .photo-stack .tile svg{ width:16px; height:16px; }
  .photo-stack .tile:nth-child(1){ left:0; top:6px; transform:rotate(-8deg); z-index:1; }
  .photo-stack .tile:nth-child(2){ left:8px; top:2px; transform:rotate(5deg); z-index:2; }
  .photo-stack .tile:nth-child(3){ left:14px; top:0; transform:rotate(0deg); z-index:3; box-shadow:0 8px 16px -8px rgba(23,20,10,0.3); }
  .photo-stack-label{ font-size:13px; font-weight:700; color:var(--cobalt); }
  .photo-stack-label svg{ width:11px; height:11px; margin-left:3px; vertical-align:-1px; }
  .sheet-close{
    position:absolute; right:14px; top:14px; width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Big drawer (details / booking) ---------- */
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:51; max-width:428px; margin:0 auto;
    background:#fff; border-radius:24px 24px 0 0; box-shadow:0 -20px 60px -20px rgba(23,20,10,0.4);
    max-height:88vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .drawer.show{ transform:translateY(0); }
  .drawer-handle{ width:36px; height:4px; border-radius:2px; background:var(--line-strong); margin:10px auto 4px; flex:none; }
  .drawer-close{
    position:absolute; right:14px; top:14px; width:28px; height:28px; border-radius:50%; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .drawer-body{ overflow-y:auto; padding:6px 20px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }

  .d-back{ background:none; border:none; color:var(--cobalt); font-size:13px; font-weight:700; padding:6px 0 10px; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .d-top{ display:flex; align-items:center; gap:10px; }
  .d-title{ font-size:19px; margin-top:2px; }
  .d-address{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .d-phrase{ font-size:13px; font-weight:700; margin-top:10px; }
  .d-phrase.ok{ color:var(--cobalt); }
  .d-phrase.alert{ color:var(--orange); }
  .d-issue{ font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }

  .photostrip{ display:flex; gap:10px; overflow-x:auto; margin:14px 0 4px; padding-bottom:2px; }
  .photo-tile{
    flex:none; width:120px; height:88px; border-radius:12px; background:var(--paper-raised);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .photo-tile svg{ width:34px; height:34px; }

  /* ---------- Receipt-style inventory ---------- */
  .receipt{
    position:relative; margin:22px 0 18px; padding:20px 18px 16px;
    background-color:#FBF8F1;
    background-image:
      radial-gradient(circle at 10px 0, transparent 9px, #fff 9.4px),
      radial-gradient(circle at 10px 100%, transparent 9px, #fff 9.4px);
    background-size:20px 16px, 20px 16px;
    background-position: top left, bottom left;
    background-repeat: repeat-x, repeat-x;
  }
  .receipt-brand{ font-family:var(--wide); font-weight:800; font-size:19px; letter-spacing:-.02em; color:#141414; text-align:center; }
  .receipt-meta{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-align:center; margin-top:4px; }
  .receipt hr{ border:none; border-top:1px dashed var(--line-strong); margin:12px 0; }
  .receipt-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:4px 0; font-family:var(--mono); }
  .receipt-row .name{ font-family:var(--sans); color:var(--ink); }
  .receipt-row .qty{ color:var(--ink-faint); white-space:nowrap; }
  .receipt-row .qty b{ color:var(--ink); font-weight:700; }
  .receipt-row .qty b.low{ color:var(--orange); }
  .receipt-row.total{ font-weight:700; color:var(--ink); }

  .section-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin:18px 0 8px; }

  .pick-row{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .pick-mid{ flex:1; min-width:0; }
  .pick-name{ font-size:13.5px; font-weight:700; }
  .pick-meta{ font-size:11.5px; margin-top:2px; }
  .pick-meta.available{ color:var(--cobalt); }
  .pick-meta.busy{ color:var(--ink-faint); }
  .pick-btn{
    flex:none; border:1.5px solid var(--cobalt); background:#fff; color:var(--cobalt);
    font-size:12px; font-weight:700; padding:8px 14px; border-radius:11px; cursor:pointer;
  }
  .pick-btn:active{ transform:scale(.96); }

  .slotgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:6px; }
  .slot{
    border:1.5px solid var(--line-strong); background:#fff; color:var(--ink); font-size:12.5px; font-weight:600;
    padding:11px 6px; border-radius:11px; cursor:pointer; text-align:center;
  }
  .slot.selected{ border-color:var(--cobalt); background:var(--cobalt-soft); color:var(--cobalt); font-weight:700; }

  .drawer-cta{
    display:block; width:100%; margin-top:18px; border:none; border-radius:13px; background:var(--cobalt); color:#fff;
    font-size:13.5px; font-weight:700; padding:13px 6px; cursor:pointer;
  }
  .drawer-cta:disabled{ opacity:.4; cursor:default; }
  .drawer-cta:active:not(:disabled){ transform:scale(.98); }

  .confirm-wrap{ text-align:center; padding:30px 6px 6px; }
  .confirm-check{
    width:56px; height:56px; border-radius:50%; background:var(--cobalt-soft); color:var(--cobalt);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .confirm-title{ font-size:16px; font-weight:700; }
  .confirm-sub{ font-size:13px; color:var(--ink-soft); margin-top:6px; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(8px);
    background:#FFFFFF; color:var(--ink); font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    z-index:80; white-space:nowrap; border:1px solid var(--line-strong);
    box-shadow:0 14px 30px -14px rgba(23,20,10,0.28);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion:reduce){ .toast, .sheet, .pin, .drawer{ transition:none; animation:none; } }
</style>
</head>
<body>

<div class="device">
  <div class="screens-viewport" id="screensViewport">
    <div class="screens-track" id="screensTrack">

      <!-- ============ MAP SCREEN ============ -->
      <section class="screen-panel">
        <div class="map-viewport" id="mapViewport">
          <div class="map-layer" id="mapLayer">
            <div class="map-layer-content">
              <svg class="streets" viewBox="0 0 900 1300" fill="none">
                <g stroke="var(--yellow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
                  <path d="M520 -10 C 460 80 430 130 460 200 C 490 270 560 260 600 330
                            C 640 400 580 450 560 520 C 540 590 460 610 430 680
                            C 400 750 460 800 480 870 C 500 940 430 970 420 1040
                            C 410 1110 470 1150 500 1220 C 520 1265 560 1285 590 1310"
                        stroke-width="15" opacity="0.95"/>
                  <path d="M460 200 C 380 210 320 190 260 210 C 200 230 150 210 90 240"
                        stroke-width="11" opacity="0.85"/>
                  <path d="M600 330 C 660 300 700 260 740 210 C 770 175 800 160 840 130"
                        stroke-width="11" opacity="0.85"/>
                  <path d="M560 520 C 480 540 430 580 440 650 C 448 710 390 730 370 790
                            C 350 850 360 910 320 960 C 295 992 260 1010 220 1030"
                        stroke-width="11" opacity="0.85"/>
                  <path d="M430 680 C 350 690 300 720 260 780 C 225 832 190 860 150 900
                            C 120 932 110 970 90 1010"
                        stroke-width="11" opacity="0.85"/>
                  <path d="M480 870 C 550 890 600 910 640 960 C 675 1005 690 1050 730 1090
                            C 765 1125 800 1140 840 1170"
                        stroke-width="11" opacity="0.85"/>
                  <path d="M840 130 C 862 220 852 300 820 380" stroke-width="7.5" opacity="0.7"/>
                  <path d="M220 1030 C 170 1040 140 1060 100 1090" stroke-width="7.5" opacity="0.7"/>
                  <path d="M90 1010 C 130 1050 160 1080 210 1100" stroke-width="7.5" opacity="0.7"/>
                  <path d="M370 790 C 300 800 250 790 190 810" stroke-width="7.5" opacity="0.7"/>
                </g>
              </svg>
              <div class="walker" id="w1"></div>
              <div class="walker" id="w2"></div>
              <div class="walker" id="w3"></div>
              <div class="walker" id="w4"></div>
              <div class="walker" id="w5"></div>
              <div id="pinLayer"></div>
            </div>
          </div>
        </div>

        <div class="chrome">
          <div class="topfade"></div>
          <header class="topbar">
            <div class="greeting wide-heading" id="greeting">Welcome, Sushmitha</div>
            <div class="locrow" onclick="document.getElementById('locInput').focus()">
              <svg class="locpin-icon" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13A7 7 0 105 9c0 5.42 7 13 7 13z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.4" fill="currentColor"/></svg>
              <input id="locInput" value="Austin — Downtown Loop" />
            </div>
          </header>
        </div>

        <div class="dock">
          <button class="dock-btn" aria-label="Use my location" onclick="useMyLocation()">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="5.2" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button class="dock-btn primary" aria-label="Jump to nearest issue" onclick="focusAttention()">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3v13M12 16l-5-5M12 16l5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="legendwrap">
          <div class="legend-title">Map key</div>
          <div class="legend-scroll" id="legendScroll"></div>
        </div>
      </section>

      <!-- ============ LIST SCREEN ============ -->
      <section class="screen-panel">
        <div class="page">
          <div class="page-head"><div class="page-title wide-heading">Your Machines</div></div>
          <div class="searchrow">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="listSearch" placeholder="Search machines or locations" />
          </div>
          <div id="listRows"></div>
          <div class="empty-state" id="listEmpty" style="display:none;">No machines match your search.</div>
        </div>
      </section>

    </div>
  </div>

  <div class="navwrap">
    <nav class="navbar" aria-label="Primary">
      <button class="tab active" data-screen="0" onclick="setScreen(0)">Map</button>
      <button class="tab" data-screen="1" onclick="setScreen(1)">List</button>
    </nav>
  </div>

  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <button class="sheet-close" onclick="closeSheet()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-top">
      <div class="sheet-badge" id="sheetBadge">—</div>
      <div>
        <div class="sheet-name" id="sheetName">Machine</div>
        <div class="sheet-address" id="sheetAddress">—</div>
      </div>
    </div>
    <div class="sheet-phrase" id="sheetPhrase"></div>
    <button class="photo-stack-row" id="photoStackTrigger">
      <div class="photo-stack">
        <div class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/></svg></div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/></svg></div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M4 15l4.5-4.5L12 14l3-3 5 5" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/></svg></div>
      </div>
      <span class="photo-stack-label">View more details <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
  </div>

  <div class="drawer" id="drawer">
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="drawer-handle"></div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  /* ================= categories ================= */
  const categories = {
    transit:   { code:'T', label:'Transit' },
    workplace: { code:'W', label:'Workplace' },
    university:{ code:'U', label:'University' },
    park:      { code:'P', label:'Park' },
    hospital:  { code:'H', label:'Hospital' },
    library:   { code:'L', label:'Library' },
    gym:       { code:'G', label:'Gym' },
  };

  /* ================= data ================= */
  const machines = [
    { id:'#01', name:'Downtown Transit Hub', address:'Downtown Austin Transit Center', category:'transit', x:420, y:560, status:'ok',
      phrase:'Fully stocked', when:'Today', whenTime:'8:10 AM', listStatus:'Good',
      issue:'Fully stocked, running smoothly.',
      inventory:[ {name:'Snack Mix', ordered:60, left:54}, {name:'Coffee Beans (kg)', ordered:20, left:17}, {name:'Bottled Water', ordered:40, left:36}, {name:'Granola Bars', ordered:30, left:26} ] },
    { id:'#07', name:'Tech Corridor — Bldg C', address:'East Austin Tech Corridor, Bldg C', category:'workplace', x:620, y:410, status:'critical',
      phrase:'Restock needed now', when:'Yesterday', whenTime:'9:20 AM', listStatus:'Pending',
      issue:'Two columns empty since this morning. Card reader also flagged flaky — worth a look while restocking.',
      inventory:[ {name:'Snack Mix', ordered:60, left:0}, {name:'Cold Drinks', ordered:48, left:0}, {name:'Energy Bars', ordered:30, left:6}, {name:'Gum Packs', ordered:40, left:9} ] },
    { id:'#05', name:'University Row', address:'University of Texas at Austin', category:'university', x:290, y:290, status:'warning',
      phrase:'Selling out fast', when:'2 days ago', whenTime:'4:45 PM', listStatus:'On the way',
      issue:'Candy at 22% and selling fast — a campus event nearby is driving demand.',
      inventory:[ {name:'Candy Assorted', ordered:50, left:11}, {name:'Chips', ordered:40, left:18}, {name:'Soda Cans', ordered:36, left:20}, {name:'Granola Bars', ordered:24, left:14} ] },
    { id:'#04', name:'Riverside Park', address:'Lady Bird Lake Riverside Park', category:'park', x:190, y:700, status:'ok',
      phrase:'Fully stocked', when:'Yesterday', whenTime:'11:02 AM', listStatus:'Good',
      issue:'Stocked, slightly overweighted on Healthy this week.',
      inventory:[ {name:'Healthy Snacks', ordered:30, left:22}, {name:'Bottled Water', ordered:40, left:33}, {name:'Trail Mix', ordered:24, left:19}, {name:'Sparkling Water', ordered:20, left:15} ] },
    { id:'#09', name:'City Hospital Lobby', address:'Dell Seton Medical Center', category:'hospital', x:520, y:790, status:'repair',
      phrase:'Needs repair', when:'3 days ago', whenTime:'3:15 PM', listStatus:'Scheduled',
      issue:'Coin mechanism jammed. Card payments still work; coin sales are blocked until serviced.',
      inventory:[ {name:'Snack Mix', ordered:45, left:28}, {name:'Coffee Beans (kg)', ordered:18, left:12}, {name:'Bottled Water', ordered:36, left:24} ] },
    { id:'#02', name:'Central Library', address:'Austin Central Library', category:'library', x:380, y:460, status:'ok',
      phrase:'Fully stocked', when:'Today', whenTime:'7:40 AM', listStatus:'Good',
      issue:'Fully stocked.',
      inventory:[ {name:'Snack Mix', ordered:40, left:35}, {name:'Coffee Beans (kg)', ordered:16, left:13}, {name:'Granola Bars', ordered:24, left:20} ] },
    { id:'#12', name:'Airport Terminal B', address:'Austin-Bergstrom Intl Airport', category:'transit', x:710, y:990, status:'critical',
      phrase:'Nearly out of stock', when:'Yesterday', whenTime:'1:30 PM', listStatus:'Scheduled',
      issue:'Snacks empty for ~40 minutes on a high-traffic route — highest sales-loss risk right now.',
      inventory:[ {name:'Snack Mix', ordered:70, left:0}, {name:'Chips', ordered:50, left:4}, {name:'Bottled Water', ordered:48, left:10}, {name:'Candy Assorted', ordered:40, left:7} ] },
    { id:'#08', name:'Westside Gym', address:'Westside Fitness Center', category:'gym', x:150, y:960, status:'ok',
      phrase:'Fully stocked', when:'2 days ago', whenTime:'1:30 PM', listStatus:'Good',
      issue:'Fully stocked.',
      inventory:[ {name:'Protein Bars', ordered:36, left:29}, {name:'Sparkling Water', ordered:30, left:24}, {name:'Sports Drink', ordered:30, left:21} ] },
  ];

  // assign badge codes per category (T1, T2, U1, G1, ...)
  const catCounters = {};
  machines.forEach(m=>{
    catCounters[m.category] = (catCounters[m.category]||0) + 1;
    m.badge = categories[m.category].code + catCounters[m.category];
  });

  const distributors = [
    { name:'Metro Supply Co.', available:true, note:'Available now · 12 min away' },
    { name:'Fresh Route Distributors', available:false, note:'Busy — free in 1h 40m' },
    { name:'CityStock Logistics', available:true, note:'Available now · 25 min away' },
  ];
  const technicians = [
    { name:'Miguel Reyes', expertise:'Coin mechanisms', available:true, note:'Available now · 0.4 mi away' },
    { name:'Ana Torres', expertise:'Card readers & electronics', available:false, note:'Busy until 2:30 PM' },
    { name:'Devon Kim', expertise:'General maintenance', available:true, note:'Available now · 2.3 mi away' },
  ];
  const timeSlots = ['Today · 2:00 PM','Today · 4:30 PM','Tomorrow · 9:00 AM','Tomorrow · 1:00 PM'];

  function statusColor(m){ return m.status==='ok' ? '#1D3AE8' : '#E8791E'; }
  function statusClass(m){ return m.status==='ok' ? 'ok' : 'alert'; }

  function photoTiles(){
    const icons = [
      '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="2.5" width="14" height="19" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="7.3" y="5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="12.7" y="5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="9" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="14" r="2.4" stroke="currentColor" stroke-width="1.4"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 15l4.5-4.5L12 14l3-3 5 5" stroke="currentColor" stroke-width="1.4"/></svg>',
    ];
    return '<div class="photostrip">' + icons.map(i=>'<div class="photo-tile">'+i+'</div>').join('') + '</div>';
  }

  /* ================= map pins ================= */
  const pinLayer = document.getElementById('pinLayer');
  machines.forEach(m=>{
    const btn = document.createElement('button');
    btn.className = 'pin' + (m.status!=='ok' ? ' attention' : '');
    btn.style.left = m.x+'px'; btn.style.top = m.y+'px';
    btn.style.background = statusColor(m);
    btn.textContent = m.badge;
    btn.setAttribute('aria-label', m.name+' — '+m.phrase);
    btn.addEventListener('click', ()=>{ zoomTo(ZOOM_IN, m.x, m.y); openSheet(m); });
    pinLayer.appendChild(btn);
  });

  /* ================= legend (fixed, doesn't pan with map) ================= */
  const legendScroll = document.getElementById('legendScroll');
  const catOrder = ['transit','workplace','university','park','hospital','library','gym'];
  catOrder.forEach(catKey=>{
    const list = machines.filter(m=>m.category===catKey);
    if(!list.length) return;
    const card = document.createElement('div');
    card.className = 'legend-card';
    card.innerHTML = '<div class="legend-cat">'+categories[catKey].label+'</div>' +
      list.map(m=>
        '<div class="legend-item"><span class="legend-badge" style="background:'+statusColor(m)+'">'+m.badge+'</span><span class="legend-name">'+m.name+'</span></div>'
      ).join('');
    legendScroll.appendChild(card);
  });

  /* ================= quick card (sheet) ================= */
  const scrim = document.getElementById('scrim');
  const sheet = document.getElementById('sheet');
  let currentMachine = null;

  window.openSheet = function(m){
    currentMachine = m;
    const color = statusColor(m);
    document.getElementById('sheetBadge').textContent = m.badge;
    document.getElementById('sheetBadge').style.background = color;
    document.getElementById('sheetName').textContent = m.name;
    document.getElementById('sheetAddress').textContent = m.address;
    const phraseEl = document.getElementById('sheetPhrase');
    phraseEl.textContent = m.phrase;
    phraseEl.className = 'sheet-phrase ' + statusClass(m);

    scrim.classList.add('show');
    sheet.classList.add('show');
  };
  document.getElementById('photoStackTrigger').addEventListener('click', ()=>{
    if(!currentMachine) return;
    if(currentMachine.status==='repair'){ openRepairDrawer(currentMachine); }
    else { openInventoryDrawer(currentMachine); }
  });
  window.closeSheet = function(){
    scrim.classList.remove('show'); sheet.classList.remove('show');
    zoomOut();
  };

  /* ================= big drawer: inventory / repair ================= */
  const drawerEl = document.getElementById('drawer');
  const drawerBody = document.getElementById('drawerBody');
  function showDrawer(){ sheet.classList.remove('show'); scrim.classList.add('show'); drawerEl.classList.add('show'); }
  window.closeDrawer = function(){
    drawerEl.classList.remove('show'); scrim.classList.remove('show');
    zoomOut();
  };

  function headerBlock(m){
    return '<div class="d-top">'+
        '<div class="sheet-badge" style="background:'+statusColor(m)+'">'+m.badge+'</div>'+
        '<div><div class="d-title wide-heading">'+m.name+'</div><div class="d-address">'+m.address+'</div></div>'+
      '</div>'+
      '<div class="d-phrase '+statusClass(m)+'">'+m.phrase+'</div>'+
      '<div class="d-issue">'+m.issue+'</div>';
  }
  function receiptBlock(m){
    const rows = m.inventory.map(it=>
      '<div class="receipt-row"><span class="name">'+it.name+'</span><span class="qty">'+it.ordered+' ordered · <b'+(it.left===0?' class="low"':'')+'>'+it.left+' left</b></span></div>'
    ).join('');
    const totalOrdered = m.inventory.reduce((s,it)=>s+it.ordered,0);
    const totalLeft = m.inventory.reduce((s,it)=>s+it.left,0);
    return '<div class="receipt">'+
        '<div class="receipt-brand">INVENTORY</div>'+
        '<div class="receipt-meta">'+m.badge+' · '+m.when+' · '+m.whenTime+'</div>'+
        '<hr>'+
        rows+
        '<hr>'+
        '<div class="receipt-row total"><span>TOTAL ORDERED</span><span>'+totalOrdered+'</span></div>'+
        '<div class="receipt-row total"><span>TOTAL LEFT</span><span>'+totalLeft+'</span></div>'+
      '</div>';
  }

  window.openInventoryDrawer = function(m){
    renderInventoryStep(m);
    showDrawer();
  };
  function renderInventoryStep(m){
    const needsAction = m.status!=='ok';
    drawerBody.innerHTML =
      headerBlock(m)+
      photoTiles()+
      receiptBlock(m)+
      (needsAction ? '<button class="drawer-cta" id="notifyBtn">Notify delivery</button>' : '');
    if(needsAction) document.getElementById('notifyBtn').addEventListener('click', ()=> renderDistributorStep(m));
  }
  function renderDistributorStep(m){
    const rows = distributors.map((d,i)=>
      '<div class="pick-row"><div class="pick-mid"><div class="pick-name">'+d.name+'</div>'+
      '<div class="pick-meta '+(d.available?'available':'busy')+'">'+d.note+'</div></div>'+
      '<button class="pick-btn" data-i="'+i+'">Book</button></div>'
    ).join('');
    drawerBody.innerHTML =
      '<button class="d-back" id="backBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>'+
      '<div class="d-title wide-heading">Choose a distributor</div>'+
      '<div style="margin-top:6px;">'+rows+'</div>';
    document.getElementById('backBtn').addEventListener('click', ()=> renderInventoryStep(m));
    drawerBody.querySelectorAll('.pick-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> renderSlotStep(m, distributors[+btn.dataset.i].name, 'distributor'));
    });
  }
  window.openRepairDrawer = function(m){
    renderRepairStep(m);
    showDrawer();
  };
  function renderRepairStep(m){
    const rows = technicians.map((t,i)=>
      '<div class="pick-row"><div class="pick-mid"><div class="pick-name">'+t.name+'</div>'+
      '<div class="pick-meta">'+t.expertise+'</div>'+
      '<div class="pick-meta '+(t.available?'available':'busy')+'">'+t.note+'</div></div>'+
      '<button class="pick-btn" data-i="'+i+'">Assign</button></div>'
    ).join('');
    drawerBody.innerHTML =
      headerBlock(m)+
      photoTiles()+
      receiptBlock(m)+
      '<div class="section-label">Assign a technician</div>'+
      rows;
    drawerBody.querySelectorAll('.pick-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> renderSlotStep(m, technicians[+btn.dataset.i].name, 'technician'));
    });
  }
  function renderSlotStep(m, who, kind){
    const backFn = kind==='distributor' ? (()=>renderDistributorStep(m)) : (()=>renderRepairStep(m));
    let selected = null;
    const chips = timeSlots.map((s,i)=>'<button class="slot" data-i="'+i+'">'+s+'</button>').join('');
    drawerBody.innerHTML =
      '<button class="d-back" id="backBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>'+
      '<div class="d-title wide-heading">Pick a time</div>'+
      '<div class="d-address">with '+who+'</div>'+
      '<div class="slotgrid">'+chips+'</div>'+
      '<button class="drawer-cta" id="confirmBtn" disabled>Confirm booking</button>';
    document.getElementById('backBtn').addEventListener('click', backFn);
    const confirmBtn = document.getElementById('confirmBtn');
    drawerBody.querySelectorAll('.slot').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        drawerBody.querySelectorAll('.slot').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        selected = timeSlots[+chip.dataset.i];
        confirmBtn.disabled = false;
      });
    });
    confirmBtn.addEventListener('click', ()=> renderConfirmStep(m, who, selected, kind));
  }
  function renderConfirmStep(m, who, slot, kind){
    drawerBody.innerHTML =
      '<div class="confirm-wrap">'+
        '<div class="confirm-check"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
        '<div class="confirm-title">Booked with '+who+'</div>'+
        '<div class="confirm-sub">'+slot+' · '+m.name+'</div>'+
        '<button class="drawer-cta" id="doneBtn" style="margin-top:22px;">Done</button>'+
      '</div>';
    document.getElementById('doneBtn').addEventListener('click', ()=>{
      closeDrawer();
      showToast((kind==='distributor'?'Delivery':'Technician visit')+' booked for '+m.id);
    });
  }

  /* ================= toast ================= */
  let toastTimer;
  window.showToast = function(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
  };

  /* ================= location ================= */
  const locInput = document.getElementById('locInput');
  locInput.addEventListener('click', (e)=> e.stopPropagation());
  window.useMyLocation = function(){
    if(!navigator.geolocation){ showToast('Location services unavailable on this device'); return; }
    showToast('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ showToast('Located · '+pos.coords.latitude.toFixed(2)+', '+pos.coords.longitude.toFixed(2)); },
      ()=>{ showToast('Location permission denied'); },
      { timeout:6000 }
    );
  };
  window.focusAttention = function(){
    const first = machines.find(m=>m.status!=='ok');
    if(first){ zoomTo(ZOOM_IN, first.x, first.y); }
  };

  /* ================= draggable + zoomable map ================= */
  const LAYER_W = 900, LAYER_H = 1300;
  const ZOOM_IN = 0.85;
  const OVERSCROLL = 130;
  const viewport = document.getElementById('mapViewport');
  const layer = document.getElementById('mapLayer');
  let scale = 0.3, scaleFit = 0.3;
  let tx = 0, ty = 0, mapDragging=false, startX=0, startY=0, baseX=0, baseY=0;

  function computeFit(){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    scaleFit = Math.min(vw/LAYER_W, vh/LAYER_H) * 0.94;
  }
  function clamp(){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cw = LAYER_W*scale, ch = LAYER_H*scale;
    if(cw<=vw){ const c=(vw-cw)/2; tx = Math.max(c-OVERSCROLL, Math.min(c+OVERSCROLL, tx)); }
    else{ tx = Math.max(vw-cw, Math.min(0,tx)); }
    if(ch<=vh){ const c=(vh-ch)/2; ty = Math.max(c-OVERSCROLL, Math.min(c+OVERSCROLL, ty)); }
    else{ ty = Math.max(vh-ch, Math.min(0,ty)); }
  }
  function apply(){ layer.style.transform = 'translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')'; }
  function animateTo(duration){
    layer.style.transition = 'transform '+duration+'s cubic-bezier(.2,.8,.2,1)';
    apply();
    setTimeout(()=>{ layer.style.transition=''; }, duration*1000+30);
  }
  window.zoomTo = function(targetScale, x, y){
    scale = targetScale;
    tx = viewport.clientWidth/2 - x*scale;
    ty = viewport.clientHeight/2 - y*scale;
    clamp();
    animateTo(0.5);
  };
  window.zoomOut = function(){
    scale = scaleFit;
    clamp();
    animateTo(0.5);
  };
  computeFit(); scale = scaleFit; clamp(); apply();

  viewport.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.pin')) return;
    mapDragging=true; viewport.classList.add('dragging'); viewport.setPointerCapture(e.pointerId);
    startX=e.clientX; startY=e.clientY; baseX=tx; baseY=ty;
  });
  viewport.addEventListener('pointermove', (e)=>{
    if(!mapDragging) return;
    tx = baseX + (e.clientX-startX); ty = baseY + (e.clientY-startY);
    clamp(); apply();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
    viewport.addEventListener(ev, ()=>{ mapDragging=false; viewport.classList.remove('dragging'); });
  });
  window.addEventListener('resize', ()=>{ computeFit(); if(scale<scaleFit){ scale=scaleFit; } clamp(); apply(); });

  const walkPaths = [
    { el:'w1', x1:20, y1:390, x2:880, y2:390, dur:26 },
    { el:'w2', x1:880, y1:730, x2:20, y2:730, dur:32 },
    { el:'w3', x1:270, y1:20, x2:270, y2:1280, dur:38 },
    { el:'w4', x1:20, y1:60, x2:860, y2:940, dur:44 },
    { el:'w5', x1:570, y1:1290, x2:570, y2:30, dur:30 },
  ];
  walkPaths.forEach(p=>{
    const el = document.getElementById(p.el);
    let start = performance.now() - Math.random()*p.dur*1000;
    function frame(now){
      const t = ((now-start)/1000 % (p.dur*2)) / p.dur;
      const f = t<=1 ? t : 2-t;
      const x = p.x1 + (p.x2-p.x1)*f;
      const y = p.y1 + (p.y2-p.y1)*f;
      el.style.transform = 'translate('+x+'px,'+y+'px)';
      requestAnimationFrame(frame);
    }
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ requestAnimationFrame(frame); }
    else{ el.style.display='none'; }
  });

  /* ================= list screen ================= */
  const listRows = document.getElementById('listRows');
  const listEmpty = document.getElementById('listEmpty');
  const listSearch = document.getElementById('listSearch');
  listSearch.addEventListener('input', renderList);
  function renderList(){
    const q = listSearch.value.trim().toLowerCase();
    const rows = machines.filter(m=> !q || m.name.toLowerCase().includes(q) || m.address.toLowerCase().includes(q));
    listRows.innerHTML = '';
    listEmpty.style.display = rows.length ? 'none' : 'block';
    rows.forEach(m=>{
      const [d1, d2] = m.when.includes(' ')&&m.when!=='Today'&&m.when!=='Yesterday' ? [m.when, m.whenTime] : [m.when, m.whenTime];
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML =
        '<div class="list-when"><div class="d1">'+m.when+'</div><div class="d2">'+m.whenTime+'</div></div>'+
        '<div class="list-mid"><div class="list-name">'+m.name+'</div><div class="list-address">'+m.address+'</div></div>'+
        '<div class="list-status '+statusClass(m)+'">'+m.listStatus+'</div>';
      row.addEventListener('click', ()=>{
        if(m.status==='repair'){ openRepairDrawer(m); } else { openInventoryDrawer(m); }
      });
      listRows.appendChild(row);
    });
  }
  renderList();

  /* ================= screens: tap + swipe ================= */
  const screensViewport = document.getElementById('screensViewport');
  const screensTrack = document.getElementById('screensTrack');
  const tabs = document.querySelectorAll('.navbar .tab');
  const SCREEN_COUNT = 2;
  let screenIndex = 0;

  window.setScreen = function(i){
    screenIndex = i;
    screensTrack.style.transform = 'translateX(-'+(i*100/SCREEN_COUNT)+'%)';
    tabs.forEach(t=> t.classList.toggle('active', +t.dataset.screen===i));
  };

  let swipeActive=false, swipeStartX=0, swipeStartY=0, swipeBaseX=0, deciding=false, isHorizontal=false;
  screensViewport.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('#mapViewport')) return; // map handles its own drag
    swipeActive=true; deciding=true; isHorizontal=false;
    swipeStartX=e.clientX; swipeStartY=e.clientY;
    swipeBaseX = -(screenIndex*100/SCREEN_COUNT);
  });
  screensViewport.addEventListener('pointermove', (e)=>{
    if(!swipeActive) return;
    const dx = e.clientX-swipeStartX, dy = e.clientY-swipeStartY;
    if(deciding){
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      isHorizontal = Math.abs(dx) > Math.abs(dy);
      deciding=false;
      if(isHorizontal){ screensTrack.classList.add('dragging'); }
    }
    if(!isHorizontal) return;
    const vw = screensViewport.clientWidth || 1;
    const deltaPct = (dx/vw) * (100/SCREEN_COUNT);
    let pct = swipeBaseX + deltaPct;
    pct = Math.max(-100*(SCREEN_COUNT-1)/SCREEN_COUNT, Math.min(0, pct));
    screensTrack.style.transform = 'translateX('+pct+'%)';
  });
  function swipeEnd(e){
    if(!swipeActive) return;
    swipeActive=false;
    if(!isHorizontal){ return; }
    screensTrack.classList.remove('dragging');
    const dx = (e.clientX||swipeStartX) - swipeStartX;
    const vw = screensViewport.clientWidth || 1;
    let next = screenIndex;
    if(dx < -vw*0.18 && screenIndex<SCREEN_COUNT-1) next = screenIndex+1;
    else if(dx > vw*0.18 && screenIndex>0) next = screenIndex-1;
    setScreen(next);
  }
  screensViewport.addEventListener('pointerup', swipeEnd);
  screensViewport.addEventListener('pointercancel', swipeEnd);
})();
</script>
</body>
</html>
