<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VendOps — Fleet Map</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-raised:#F6F6F7;
    --ink:#17181B;
    --ink-soft:#5B5A54;
    --ink-faint:#9B978C;
    --line: rgba(23,24,27,0.13);
    --line-strong: rgba(23,24,27,0.24);
    --cobalt:#1D3AE8;
    --cobalt-soft: rgba(29,58,232,0.12);
    --cobalt-glass: rgba(64,92,240,0.14);
    --b-good:#7C93F5;
    --b-low:#4A66E6;
    --b-empty:#1D3AE8;
    --b-repair:#101B5E;
    --glass-fill: rgba(255,255,255,0.62);
    --glass-fill-strong: rgba(255,255,255,0.86);
    --glass-border: rgba(29,58,232,0.14);
    --glass-shadow: 0 24px 46px -22px rgba(23,20,10,0.24), 0 1px 0 rgba(255,255,255,0.6) inset;
    --scrim: rgba(20,30,55,0.32);
    --display: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:#FFFFFF;
    color:var(--ink);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:30px 16px;
  }
  button, input{ font-family:inherit; }
  ::selection{ background:var(--cobalt-soft); }

  .device{
    width:100%; max-width:428px; height:920px; max-height:92vh;
    background:var(--paper);
    border-radius:34px; overflow:hidden; position:relative;
    box-shadow:0 40px 80px -30px rgba(20,17,10,0.28), 0 0 0 1px var(--line-strong);
  }
  @media (max-width:520px){
    body{ padding:0; }
    .device{ max-width:100%; height:100vh; max-height:100vh; border-radius:0; box-shadow:none; }
  }

  /* ---------- Map stage ---------- */
  .map-viewport{
    position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; background:#fff;
  }
  .map-viewport.dragging{ cursor:grabbing; }
  .map-layer{
    position:absolute; left:0; top:0; width:900px; height:1300px;
    background:#FFFFFF;
    will-change:transform;
  }
  .map-layer svg.streets{ position:absolute; inset:0; width:100%; height:100%; }
  .watermark{
    position:absolute; left:44px; top:120px; font-weight:700; letter-spacing:-0.03em;
    font-size:96px; line-height:0.86; color:var(--cobalt); opacity:0.055; white-space:pre; pointer-events:none;
    text-transform:uppercase;
  }

  .pin{
    position:absolute; width:34px; height:42px; margin:-42px 0 0 -17px;
    border:none; padding:0; cursor:pointer; background:none;
    filter:drop-shadow(0 6px 10px rgba(23,24,27,0.16));
  }
  .pin svg{ width:100%; height:100%; overflow:visible; }
  .pin.attention{ animation:pinpulse 2.2s ease-in-out infinite; }
  @keyframes pinpulse{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  @media (prefers-reduced-motion:reduce){ .pin.attention{ animation:none; } }

  .walker{
    position:absolute; width:5px; height:5px; border-radius:50%; background:var(--cobalt);
    opacity:0.32; pointer-events:none;
  }

  /* ---------- Chrome overlay (fixed above map) ---------- */
  .chrome{ position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; }
  .chrome > *{ pointer-events:auto; }

  .topfade{
    position:absolute; left:0; right:0; top:0; height:150px;
    background:linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 60%, transparent 100%);
    pointer-events:none !important;
  }

  .topbar{ position:relative; padding:16px 18px 0; z-index:2; }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; }
  .mark{ display:flex; align-items:center; gap:7px; }
  .mark-glyph{ width:22px; height:22px; }
  .mark-word{ font-size:13px; font-weight:700; letter-spacing:-0.01em; }
  .navrow{ display:flex; gap:16px; }
  .navlink{
    background:none; border:none; padding:2px 0; cursor:pointer; color:var(--ink-faint);
    font-size:10px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  }
  .navlink.active{ color:var(--cobalt); font-weight:800; }
  .navlink:focus-visible{ outline:2px solid var(--cobalt); outline-offset:3px; }
  .counter{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:0.02em;
    color:var(--cobalt); font-variant-numeric:tabular-nums;
  }
  .counter.attn{ color:var(--b-repair); }

  .metarow{
    display:flex; align-items:baseline; justify-content:space-between; margin-top:14px;
    padding:0 2px;
  }
  .collection-label{ font-size:11px; letter-spacing:.03em; color:var(--ink-soft); }
  .collection-label b{ color:var(--ink); font-weight:700; }

  .locrow{ margin-top:8px; display:flex; align-items:center; gap:6px; cursor:text; }
  .locpin-icon{ width:12px; height:12px; color:var(--cobalt); flex:none; }
  #locInput{
    border:none; background:none; font-size:11.5px; font-weight:700; color:var(--ink);
    padding:2px 0; width:auto; max-width:240px;
  }
  #locInput:focus{ outline:none; }

  /* ---------- Floating dock (jump to queue + geolocate) ---------- */
  .dock{
    position:absolute; right:16px; bottom:104px; z-index:3; display:flex; flex-direction:column; gap:10px;
  }
  .dock-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-border);
    background:var(--glass-fill-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:var(--glass-shadow); display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--cobalt);
  }
  .dock-btn:active{ transform:scale(0.94); }
  .dock-btn.primary{ background:var(--cobalt); color:#fff; border-color:transparent; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    background:linear-gradient(0deg, #fff 30%, rgba(255,255,255,0.7) 80%, transparent 100%);
    padding:26px 18px calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:26px;
  }
  .tab{
    background:none; border:none; cursor:pointer; color:var(--ink-faint);
    font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    padding:4px 2px;
  }
  .tab.active{ color:var(--cobalt); font-weight:800; }

  /* ---------- Bottom sheet ---------- */
  .scrim{
    position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:10;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:11;
    background:#FFFFFF; border:2px solid var(--cobalt); border-radius:22px;
    box-shadow:0 26px 50px -24px rgba(23,20,10,0.32);
    padding:16px 18px 18px;
    transform:translateY(16px) scale(0.98); opacity:0; transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
    pointer-events:none;
  }
  .sheet.show{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
  .sheet-address{
    font-family:var(--mono); font-size:10.5px; color:var(--cobalt); letter-spacing:.02em;
    padding-right:26px; line-height:1.4;
  }
  .sheet-top{ display:flex; gap:14px; align-items:flex-start; margin-top:10px; }
  .sheet-icon{
    width:52px; height:52px; border-radius:14px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--cobalt-soft); border:1.5px solid var(--icon-color, var(--cobalt));
  }
  .sheet-icon svg{ width:28px; height:28px; }
  .sheet-id{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
  .sheet-name{ font-size:17px; font-weight:700; letter-spacing:-.01em; margin-top:1px; }
  .sheet-status{
    display:inline-flex; align-items:center; gap:6px; margin-top:7px; font-size:11px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--status-color, var(--cobalt));
  }
  .sheet-status svg{ width:11px; height:11px; flex:none; }
  .sheet-issue{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:12px; }
  .sheet-meta{ display:flex; gap:18px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .sheet-meta div{ font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }
  .sheet-meta b{ display:block; font-family:var(--mono); font-size:13px; color:var(--ink); font-weight:700; margin-top:3px; letter-spacing:0; text-transform:none; }
  .sheet-actions{ display:flex; gap:8px; margin-top:16px; }
  .sheet-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    border-radius:13px; border:1.5px solid var(--cobalt); background:#fff;
    color:var(--cobalt); font-size:12.5px; font-weight:700; padding:11px 6px; cursor:pointer; text-align:center;
  }
  .sheet-btn svg{ width:12px; height:12px; flex:none; }
  .sheet-btn.primary{ background:var(--cobalt); color:#fff; }
  .sheet-btn.repair{ background:var(--b-repair); color:#fff; border-color:var(--b-repair); }
  .sheet-btn:active{ transform:scale(.97); }
  .sheet-btn.sent{ opacity:.55; }
  .sheet-close{
    position:absolute; right:14px; top:14px; width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(8px);
    background:#FFFFFF; color:var(--ink); font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    z-index:80; white-space:nowrap; border:1px solid var(--line-strong);
    box-shadow:0 14px 30px -14px rgba(23,20,10,0.28);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion:reduce){ .toast, .sheet, .pin{ transition:none; animation:none; } }
</style>
</head>
<body>

<div class="device">
  <div class="map-viewport" id="mapViewport">
    <div class="map-layer" id="mapLayer">
      <svg class="streets" viewBox="0 0 900 1300" fill="none">
        <defs>
          <filter id="sketchyA" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="4" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="sketchyB" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.015 0.025" numOctaves="2" seed="11" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="sketchyPin" x="-40%" y="-40%" width="180%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.06 0.09" numOctaves="2" seed="6" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <g stroke="var(--cobalt)" stroke-linecap="round" fill="none">
          <path d="M6 380 H894" stroke-width="2.4" opacity="0.55" filter="url(#sketchyA)"/>
          <path d="M6 722 H894" stroke-width="2.4" opacity="0.55" filter="url(#sketchyB)"/>
          <path d="M6 1018 H894" stroke-width="2.4" opacity="0.55" filter="url(#sketchyA)"/>
          <path d="M260 6 V1294" stroke-width="2.4" opacity="0.55" filter="url(#sketchyB)"/>
          <path d="M560 6 V1294" stroke-width="2.4" opacity="0.55" filter="url(#sketchyA)"/>
          <path d="M10 60 L890 980" stroke-width="2.4" opacity="0.5" filter="url(#sketchyB)"/>
          <path d="M40 1100 Q 400 950 860 1180" stroke-width="10" opacity="0.28" filter="url(#sketchyA)"/>
        </g>
      </svg>
      <div class="watermark" id="watermark">DOWNTOWN{'\n'}LOOP</div>

      <div class="walker" id="w1"></div>
      <div class="walker" id="w2"></div>
      <div class="walker" id="w3"></div>
      <div class="walker" id="w4"></div>
      <div class="walker" id="w5"></div>

      <div id="pinLayer"></div>
    </div>
  </div>

  <div class="chrome">
    <div class="topfade"></div>
    <header class="topbar">
      <div class="topbar-row">
        <div class="mark">
          <svg class="mark-glyph" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 18H15M6 18V9" stroke="var(--cobalt)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mark-word">VENDOPS</span>
        </div>
        <nav class="navrow">
          <button class="navlink active">Map</button>
          <button class="navlink" onclick="showToast('Alerts — coming to this screen next')">Alerts</button>
          <button class="navlink" onclick="showToast('Analytics — parked for now')">Analytics</button>
          <button class="navlink" onclick="showToast('Profile — routes, team, settings')">Profile</button>
        </nav>
      </div>
      <div class="metarow">
        <div class="collection-label">A/12 — <b>Fleet Map</b> · 8 machines</div>
        <div class="counter attn" id="counterBadge">(2/8)</div>
      </div>
      <div class="locrow" onclick="document.getElementById('locInput').focus()">
        <svg class="locpin-icon" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13A7 7 0 105 9c0 5.42 7 13 7 13z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.4" fill="currentColor"/></svg>
        <input id="locInput" value="Austin — Downtown Loop" />
      </div>
    </header>
  </div>

  <div class="dock">
    <button class="dock-btn" aria-label="Use my location" onclick="useMyLocation()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="5.2" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="dock-btn primary" aria-label="Jump to nearest issue" onclick="focusAttention()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3v13M12 16l-5-5M12 16l5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <nav class="bottomnav" aria-label="Primary">
    <button class="tab active">Map</button>
    <button class="tab" onclick="showToast('Alerts — coming to this screen next')">Alerts</button>
    <button class="tab" onclick="showToast('Analytics — parked for now')">Analytics</button>
    <button class="tab" onclick="showToast('Profile — routes, team, settings')">Profile</button>
  </nav>

  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <button class="sheet-close" onclick="closeSheet()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-address" id="sheetAddress">—</div>
    <div class="sheet-top">
      <div class="sheet-icon" id="sheetIcon">
        <svg viewBox="0 0 24 24" fill="none" id="sheetIconSvg"><rect x="5" y="2.5" width="14" height="19" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="7.3" y="5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="12.7" y="5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="7.3" y="10" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><rect x="12.7" y="10" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.3"/><circle cx="15.5" cy="17.3" r="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
      </div>
      <div>
        <div class="sheet-id" id="sheetId">#00</div>
        <div class="sheet-name" id="sheetName">Machine</div>
        <div class="sheet-status" id="sheetStatus"><span id="sheetStatusShape"></span><span id="sheetStatusText">Stocked</span></div>
      </div>
    </div>
    <div class="sheet-issue" id="sheetIssue"></div>
    <div class="sheet-meta">
      <div>Last visit<b id="sheetVisit">—</b></div>
      <div>Category<b id="sheetCategory">—</b></div>
    </div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const machines = [
    { id:'#01', name:'Downtown Transit Hub', address:'310 Congress Ave, Austin, TX 78701', x:420, y:560, status:'ok', category:'Snacks · Coffee', issue:'Fully stocked, running smoothly.', visit:'Today, 8:10a' },
    { id:'#07', name:'Tech Corridor — Bldg C', address:'1200 E 6th St, Bldg C, Austin, TX 78702', x:620, y:410, status:'critical', category:'Snacks · Cold Drinks', issue:'Two columns empty since this morning. Card reader also flagged flaky — worth a look while restocking.', visit:'Yesterday' },
    { id:'#05', name:'University Row', address:'2400 Guadalupe St, Austin, TX 78705', x:290, y:290, status:'warning', category:'Candy', issue:'Candy at 22% and selling fast — a campus event nearby is driving demand.', visit:'2 days ago' },
    { id:'#04', name:'Riverside Park', address:'800 Riverside Dr, Austin, TX 78704', x:190, y:700, status:'ok', category:'Healthy · Snacks', issue:'Stocked, slightly overweighted on Healthy this week.', visit:'Yesterday' },
    { id:'#09', name:'City Hospital Lobby', address:'1201 W 38th St, Austin, TX 78731', x:520, y:790, status:'repair', category:'Snacks · Coffee', issue:'Coin mechanism jammed. Card payments still work; coin sales are blocked until serviced.', visit:'3 days ago' },
    { id:'#02', name:'Central Library', address:'710 W César Chávez St, Austin, TX 78701', x:380, y:460, status:'ok', category:'Snacks · Coffee', issue:'Fully stocked.', visit:'Today, 7:40a' },
    { id:'#12', name:'Airport Terminal B', address:'3600 Presidential Blvd, Terminal B, Austin, TX 78719', x:710, y:990, status:'critical', category:'Snacks', issue:'Snacks empty for ~40 minutes on a high-traffic route — highest sales-loss risk right now.', visit:'Yesterday' },
    { id:'#08', name:'Westside Gym', address:'4477 S Lamar Blvd, Austin, TX 78745', x:150, y:960, status:'ok', category:'Healthy · Cold Drinks', issue:'Fully stocked.', visit:'2 days ago' },
  ];
  // Status maps to a shape (what to do) and a shade of blue (how urgent) — light to dark = good to repair.
  const statusMeta = {
    ok:       { color:'#7C93F5', varName:'--b-good',   label:'Good',    shape:'circle'   },
    warning:  { color:'#4A66E6', varName:'--b-low',    label:'Restock', shape:'square'   },
    critical: { color:'#1D3AE8', varName:'--b-empty',  label:'Restock', shape:'square'   },
    repair:   { color:'#101B5E', varName:'--b-repair', label:'Repair',  shape:'triangle' },
  };

  function shapeSvg(shape, color, size){
    size = size || 14;
    if(shape==='circle') return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="'+color+'"/></svg>';
    if(shape==='square')  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" rx="2" fill="'+color+'"/></svg>';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 14 14"><path d="M7 1.5 L13 12.5 H1 Z" fill="'+color+'" stroke-linejoin="round"/></svg>';
  }

  function pinSvg(color){
    return '<svg viewBox="0 0 34 42" fill="none">'+
      '<path d="M17 1.5C9.2 1.5 3 7.6 3 15c0 9.6 14 25 14 25s14-15.4 14-25c0-7.4-6.2-13.5-14-13.5Z" '+
        'fill="#fff" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" filter="url(#sketchyPin)"/>'+
      '<circle cx="17" cy="15" r="5.2" fill="'+color+'"/>'+
    '</svg>';
  }

  const pinLayer = document.getElementById('pinLayer');
  machines.forEach(m=>{
    const meta = statusMeta[m.status];
    const btn = document.createElement('button');
    btn.className = 'pin' + (m.status!=='ok' ? ' attention' : '');
    btn.style.left = m.x+'px'; btn.style.top = m.y+'px';
    btn.innerHTML = pinSvg(meta.color);
    btn.setAttribute('aria-label', m.name+' — '+meta.label);
    btn.addEventListener('click', ()=> openSheet(m));
    pinLayer.appendChild(btn);
  });

  const attnCount = machines.filter(m=>m.status!=='ok').length;
  const badge = document.getElementById('counterBadge');
  badge.textContent = '('+attnCount+'/'+machines.length+')';
  if(attnCount===0){ badge.classList.remove('attn'); }

  /* ---------------- sheet ---------------- */
  const scrim = document.getElementById('scrim');
  const sheet = document.getElementById('sheet');
  window.openSheet = function(m){
    const meta = statusMeta[m.status];
    document.getElementById('sheetAddress').textContent = m.address;
    document.getElementById('sheetId').textContent = m.id;
    document.getElementById('sheetName').textContent = m.name;
    document.getElementById('sheetStatusText').textContent = meta.label;
    document.getElementById('sheetStatusShape').innerHTML = shapeSvg(meta.shape, meta.color, 11);
    document.getElementById('sheetStatus').style.setProperty('--status-color', meta.color);
    document.getElementById('sheetIssue').textContent = m.issue;
    document.getElementById('sheetVisit').textContent = m.visit;
    document.getElementById('sheetCategory').textContent = m.category;
    document.getElementById('sheetIcon').style.setProperty('--icon-color', meta.color);
    document.getElementById('sheetIconSvg').style.color = meta.color;

    const actions = document.getElementById('sheetActions');
    actions.innerHTML = '';
    if(m.status==='repair'){
      actions.appendChild(makeBtn('Repair', shapeSvg('triangle','#fff',12), 'repair', 'Technician notified for '+m.id));
    } else if(m.status!=='ok'){
      actions.appendChild(makeBtn('Restock', shapeSvg('square','#fff',12), 'primary', 'Restock dispatched for '+m.id));
    } else {
      actions.appendChild(makeBtn('Good', shapeSvg('circle','var(--b-good)',12), '', ''));
    }
    actions.appendChild(makeBtn('Notify delivery', '', '', 'Nearest courier notified about '+m.id));

    scrim.classList.add('show');
    sheet.classList.add('show');
  };
  function makeBtn(label, iconHtml, cls, msg){
    const b = document.createElement('button');
    b.className = 'sheet-btn' + (cls?' '+cls:'');
    b.innerHTML = (iconHtml||'') + '<span>'+label+'</span>';
    if(msg){
      b.addEventListener('click', ()=>{ b.querySelector('span').textContent='Sent ✓'; b.classList.add('sent'); b.disabled=true; showToast(msg); });
    } else {
      b.disabled = true;
    }
    return b;
  }
  window.closeSheet = function(){ scrim.classList.remove('show'); sheet.classList.remove('show'); };

  /* ---------------- toast ---------------- */
  let toastTimer;
  window.showToast = function(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
  };

  /* ---------------- location input ---------------- */
  const locInput = document.getElementById('locInput');
  const watermark = document.getElementById('watermark');
  function syncWatermark(){
    const parts = locInput.value.split('—');
    const last = (parts[parts.length-1] || locInput.value).trim();
    watermark.textContent = last.toUpperCase();
  }
  locInput.addEventListener('change', syncWatermark);
  locInput.addEventListener('blur', syncWatermark);
  locInput.addEventListener('click', (e)=> e.stopPropagation());

  window.useMyLocation = function(){
    if(!navigator.geolocation){ showToast('Location services unavailable on this device'); return; }
    showToast('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ showToast('Located · '+pos.coords.latitude.toFixed(2)+', '+pos.coords.longitude.toFixed(2)); },
      ()=>{ showToast('Location permission denied'); },
      { timeout:6000 }
    );
  };

  window.focusAttention = function(){
    const first = machines.find(m=>m.status!=='ok');
    if(first) panTo(first.x, first.y);
  };

  /* ---------------- draggable map ---------------- */
  const viewport = document.getElementById('mapViewport');
  const layer = document.getElementById('mapLayer');
  let tx = -260, ty = -260, dragging=false, startX=0, startY=0, baseX=0, baseY=0;

  function clamp(){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const minX = Math.min(0, vw - 900), minY = Math.min(0, vh - 1300);
    tx = Math.max(minX, Math.min(0, tx));
    ty = Math.max(minY, Math.min(0, ty));
  }
  function apply(){ layer.style.transform = 'translate3d('+tx+'px,'+ty+'px,0)'; }
  function panTo(x,y){
    tx = -(x - viewport.clientWidth/2);
    ty = -(y - viewport.clientHeight/2);
    clamp();
    layer.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';
    apply();
    setTimeout(()=>{ layer.style.transition=''; }, 520);
  }
  clamp(); apply();

  viewport.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.pin')) return; // let the pin's own click fire instead of starting a drag
    dragging=true; viewport.classList.add('dragging'); viewport.setPointerCapture(e.pointerId);
    startX=e.clientX; startY=e.clientY; baseX=tx; baseY=ty;
  });
  viewport.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    tx = baseX + (e.clientX-startX); ty = baseY + (e.clientY-startY);
    clamp(); apply();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
    viewport.addEventListener(ev, ()=>{ dragging=false; viewport.classList.remove('dragging'); });
  });
  window.addEventListener('resize', ()=>{ clamp(); apply(); });

  /* ---------------- walking dots, for fun ---------------- */
  const walkPaths = [
    { el:'w1', x1:20, y1:390, x2:880, y2:390, dur:26 },
    { el:'w2', x1:880, y1:730, x2:20, y2:730, dur:32 },
    { el:'w3', x1:270, y1:20, x2:270, y2:1280, dur:38 },
    { el:'w4', x1:20, y1:60, x2:860, y2:940, dur:44 },
    { el:'w5', x1:570, y1:1290, x2:570, y2:30, dur:30 },
  ];
  walkPaths.forEach(p=>{
    const el = document.getElementById(p.el);
    let start = performance.now() - Math.random()*p.dur*1000;
    function frame(now){
      const t = ((now-start)/1000 % (p.dur*2)) / p.dur;
      const f = t<=1 ? t : 2-t; // ping-pong 0..1..0
      const x = p.x1 + (p.x2-p.x1)*f;
      const y = p.y1 + (p.y2-p.y1)*f;
      el.style.transform = 'translate('+x+'px,'+y+'px)';
      requestAnimationFrame(frame);
    }
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      requestAnimationFrame(frame);
    } else {
      el.style.display='none';
    }
  });

  syncWatermark();
})();
</script>
</body>
</html>
